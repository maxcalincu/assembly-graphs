<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -50 340 190" width="680" height="380" preserveAspectRatio="xMidYMid meet">
  <!-- white background -->
  <rect x="-20" y="-50" width="340" height="190" fill="white" />

  <defs>
    <!-- arrow marker definition - adjusted to start at line end -->
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="black" stroke="none" />
    </marker>

    <!-- font style -->
    <style>
      text {
        font-family: 'Times New Roman', serif;
        font-size: 8px;
        fill: black;
      }
    </style>
  </defs>

  <!-- edges (each with an arrowhead at the child end) -->
  <!-- root to first level - shortened by radius (3px) in the direction of the line -->
  <line x1="0" y1="3" x2="27.88" y2="-24.88" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="0" y1="3" x2="27.88" y2="30.88" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 111111 chain - horizontal lines shortened by 3px at end -->
  <line x1="30" y1="-27" x2="57" y2="-27" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="60" y1="-27" x2="87" y2="-27" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="90" y1="-27" x2="117" y2="-27" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="-27" x2="147" y2="-27" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="150" y1="-27" x2="177" y2="-27" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- 2 branch initial - horizontal line shortened by 3px at end -->
  <line x1="30" y1="33" x2="57" y2="33" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from C (60,30) to D and E - diagonal lines shortened by ~2.12px in x and y (3px along diagonal) -->
  <line x1="60" y1="33" x2="87.88" y2="5.88" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="60" y1="33" x2="87.88" y2="60.12" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from D to F to G - horizontal lines shortened by 3px at end -->
  <line x1="90" y1="3" x2="117" y2="3" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="120" y1="3" x2="147" y2="3" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from E to H and I - diagonal lines shortened by ~2.12px in x and y -->
  <line x1="90" y1="63" x2="117.88" y2="35.88" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="90" y1="63" x2="117.88" y2="90.12" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from H to J - horizontal line shortened by 3px at end -->
  <line x1="120" y1="33" x2="147" y2="33" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from I to K - horizontal line shortened by 3px at end -->
  <line x1="120" y1="93" x2="147" y2="93" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from K to L and M - diagonal lines shortened by ~2.12px in x and y -->
  <line x1="150" y1="93" x2="177.88" y2="65.88" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="150" y1="93" x2="177.88" y2="120.12" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- from L to N, O, P, Q - horizontal lines shortened by 3px at end -->
  <line x1="180" y1="63" x2="207" y2="63" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="210" y1="63" x2="237" y2="63" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="240" y1="63" x2="267" y2="63" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="63" x2="297" y2="63" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Nodes as white circles with black border, radius 3 -->
  <circle cx="0" cy="3" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="-27" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="30" cy="33" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="60" cy="33" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="3" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="90" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="3" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="3" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="33" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="120" cy="93" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="33" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="150" cy="93" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="180" cy="123" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="210" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="240" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="270" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>
  <circle cx="300" cy="63" r="2.5" fill="white" stroke="black" stroke-width="1"/>

  <!-- digit labels placed near the middle of each edge (offset perpendicularly upward) -->
  <text x="9" y="-18" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="21" y="12" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="45" y="-33" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="75" y="-33" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="105" y="-33" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="135" y="-33" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="165" y="-33" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="45" y="27" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="69" y="12" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="81" y="42" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="105" y="-3" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="135" y="-3" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="99" y="42" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="111" y="72" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="135" y="27" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="135" y="87" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="159" y="72" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="171" y="102" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="195" y="57" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="225" y="57" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="255" y="57" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="285" y="57" text-anchor="middle" dominant-baseline="middle">1</text>
</svg>